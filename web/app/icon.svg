<!-- The tab mark. Keeps the circle silhouette of the header's `kd` lockup, but
     drops the letters: at 16px a two-letter monogram is mud. What survives that
     size is the site's actual motif — a row of bars with exactly one of them
     picked out, which is the whole thesis in four rectangles.

     No text, so no font: nothing here depends on what the reader has installed,
     and the mono/serif rule is not stretched to cover a 16px glyph. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="16" fill="#16181c" />
  <g fill="#9aa0a7">
    <rect x="7" y="16" width="3" height="7" rx="1" />
    <rect x="12" y="12" width="3" height="11" rx="1" />
    <rect x="22" y="14" width="3" height="9" rx="1" />
  </g>
  <rect x="17" y="8" width="3" height="15" rx="1" fill="#ef4a1e" />
</svg>
